name: Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    types: [ closed ]
    branches: [ master, main ]

# Explicitly define permissions needed for release creation
permissions:
  contents: write
  discussions: write
  pull-requests: write

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Install Playwright dependencies
        run: |
          # Use Playwright's own installation method for dependencies
          # This is more reliable than manual package installation
          npx playwright install-deps chromium
          
          # Check if installation was successful
          if [ $? -ne 0 ]; then
            echo "Playwright dependencies installation failed, trying alternative method..."
            sudo apt-get update
            # Use a more generic approach that works on most Ubuntu versions
            sudo apt-get install -y --no-install-recommends \
              libx11-xcb1 \
              libxcb-dri3-0 \
              libxcomposite1 \
              libxcursor1 \
              libxdamage1 \
              libxi6 \
              libxtst6 \
              libnss3 \
              libcups2 \
              libxss1 \
              libxrandr2 \
              libatk1.0-0 \
              libatk-bridge2.0-0 \
              libpangocairo-1.0-0 \
              libgtk-3-0 \
              libgbm1 \
              libasound2t64 \
              fonts-liberation \
              xvfb
          fi

      - name: Calculate version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty | sed 's/^v//')
          if [[ $VERSION == *-* ]]; then
            # If not a clean tag, add date and commit hash
            VERSION="${VERSION}-$(date +'%Y%m%d%H%M%S')"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Install dependencies
        run: go mod download

      - name: Build for Windows
        run: GOOS=windows GOARCH=amd64 go build -o ffastloader-windows-amd64.exe -ldflags "-s -w" .

      - name: Build for macOS (Intel)
        run: GOOS=darwin GOARCH=amd64 go build -o ffastloader-darwin-amd64 -ldflags "-s -w" .

      - name: Build for macOS (Apple Silicon)
        run: GOOS=darwin GOARCH=arm64 go build -o ffastloader-darwin-arm64 -ldflags "-s -w" .

      - name: Build for Linux (amd64)
        run: GOOS=linux GOARCH=amd64 go build -o ffastloader-linux-amd64 -ldflags "-s -w" .

      - name: Build for Linux (arm64)
        run: GOOS=linux GOARCH=arm64 go build -o ffastloader-linux-arm64 -ldflags "-s -w" .

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            ffastloader-windows-amd64.exe
            ffastloader-darwin-amd64
            ffastloader-darwin-arm64
            ffastloader-linux-amd64
            ffastloader-linux-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
